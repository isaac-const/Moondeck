[package]
name = "moondeck"
version = "1.0.0"
description = "Deck de ações contextuais para teclas subutilizadas"
authors = ["isaac-const <isaaccs.code@gmail.com>"]
license = "MIT"
repository = "https://github.com/isaac-const/Moondeck"
homepage = "https://github.com/isaac-const/Moondeck"
edition = "2024"
rust-version = "1.90"

[lib]
name = "moondeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
futures-util = "0.3"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "2.0.0-rc.29", features = ["derive", "typescript"] }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
futures = "0.3"
base64 = "0.22"
symphonia = { version = "0.5", features = ["aac", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }

# O dev build roda as dependências sem otimização; decodificar um mp3 assim
# leva segundos e estraga a latência de uma tecla de soundboard.
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", features = ["global_shortcuts"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
enigo = "0.5"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
